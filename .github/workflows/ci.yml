name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  flutter:
    name: Flutter analyze + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Frontend/ZSI_Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Infos (deprecations) are reported but only errors and warnings fail.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  web-e2e:
    name: Playwright (web build at phone sizes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Frontend/ZSI_Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --dart-define=ZSI_DEMO=true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/ZSI_Frontend/e2e/package-lock.json
      - run: npm ci
        working-directory: Frontend/ZSI_Frontend/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: Frontend/ZSI_Frontend/e2e
      - run: npx playwright test
        working-directory: Frontend/ZSI_Frontend/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            Frontend/ZSI_Frontend/e2e/playwright-report/
            Frontend/ZSI_Frontend/e2e/test-results/
          retention-days: 7

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Frontend/ZSI_Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Catches Gradle / plugin breakage like the one fixed in #2.
      - run: flutter build apk --debug --dart-define=ZSI_DEMO=true

  backend:
    name: Backend tests (incl. server smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend/ZSI_Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Backend/ZSI_Backend/requirements-server.txt
      - run: pip install -r requirements-server.txt
      - run: python -m unittest discover -s tests -v
